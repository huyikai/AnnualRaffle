name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 顺序要紧：actions/setup-node 带 cache: 'pnpm' 时会先执行
      # `pnpm store path` 定位缓存目录，pnpm 必须已经装好，否则报
      # "Unable to locate executable file: pnpm"。
      # 见 https://github.com/pnpm/action-setup#usage
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 版本取自 package.json 的 packageManager 字段，不在这里硬编码，
          # 避免 CI 与仓库的 pnpm 版本再次漂移（本仓库 lockfile 为 v9.0，需 pnpm 9+）
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 原先这里有一步 `cp src/config/user.example.ts src/config/user.ts`，
      # 用于在构建期注入名单。名单已改为运行时数据（localStorage / 应用数据目录），
      # 构建期不再需要 user.ts，该步骤已移除。

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
